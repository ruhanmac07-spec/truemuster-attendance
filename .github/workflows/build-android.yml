name: Build Android APK Deliverable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/student-android/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Capacitor Android
        run: npm run build:android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x apps/student-android/android/gradlew

      - name: Assemble Android Debug APK
        run: |
          cd apps/student-android/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueMuster-Student-Debug-APK
          path: apps/student-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
